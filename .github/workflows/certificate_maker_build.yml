name: Build CertificateMaker v1.2.3 Windows EXE

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Restore verified v1.2.1 source payload
        shell: powershell
        run: |
          $parts = Get-ChildItem "_chatgpt_payload/certificate_maker_v1.2/part_*.txt" | Sort-Object Name
          if ($parts.Count -eq 0) { throw "Payload chunks not found" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $zipPath = Join-Path $env:RUNNER_TEMP "certificate_maker_v1.2.zip"
          [IO.File]::WriteAllBytes($zipPath, [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "c9420a8fa3e7530ceea509cb3e18f4009e82ab2b4b8011c42f52ef322ffce5fe") {
            throw "Payload SHA256 mismatch: $hash"
          }
          $extract = Join-Path $env:RUNNER_TEMP "certificate_maker_src"
          Expand-Archive -Path $zipPath -DestinationPath $extract -Force
          "CERT_SRC=$extract\certificate_maker_package" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Normalize bundled sample filename
        shell: powershell
        run: |
          Set-Location $env:CERT_SRC
          $pptSamples = @(Get-ChildItem "samples" -Filter "*.pptx")
          if ($pptSamples.Count -ne 1) { throw "Expected exactly one bundled PPTX sample" }
          if ($pptSamples[0].Name -ne "template.pptx") {
            Rename-Item -LiteralPath $pptSamples[0].FullName -NewName "template.pptx"
          }
          @'
          from pathlib import Path
          p = Path("certificate_maker.py")
          s = p.read_text(encoding="utf-8")
          s = s.replace('APP_VERSION = "1.2.0"', 'APP_VERSION = "1.2.1"')
          old_name = "\uc778\uc99d\uc11c_{\uc774\ub984}_{\uacfc\uc815\uba85}.pptx"
          s = s.replace(f'sample_dir / "{old_name}"', 'sample_dir / "template.pptx"')
          p.write_text(s, encoding="utf-8", newline="\n")
          '@ | python -

      - name: Apply v1.2.3 COM export fix
        shell: powershell
        run: |
          $patchParts = Get-ChildItem "_chatgpt_payload/cert_v123_patch_part_*.txt" | Sort-Object Name
          if ($patchParts.Count -ne 3) { throw "Expected three v1.2.3 patch parts" }
          $patchPath = Join-Path $env:RUNNER_TEMP "certificate_maker_v123.patch"
          $patchText = ($patchParts | ForEach-Object { Get-Content $_.FullName -Raw -Encoding UTF8 }) -join ''
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::WriteAllText($patchPath, $patchText, $utf8NoBom)
          Set-Location $env:CERT_SRC
          git apply -p0 --whitespace=nowarn $patchPath

      - name: Validate source
        shell: powershell
        run: |
          Set-Location $env:CERT_SRC
          python -m py_compile certificate_maker.py
          if (Select-String -Path certificate_maker.py -Pattern '^import zipfile|from openpyxl|load_workbook' -Quiet) {
            throw "Legacy ZIP/openpyxl runtime path detected"
          }
          if (-not (Select-String -Path certificate_maker.py -Pattern 'load_excel_rows_com' -Quiet)) { throw "Excel COM loader missing" }
          if (-not (Select-String -Path certificate_maker.py -Pattern 'APP_VERSION = "1.2.3"' -Quiet)) { throw "Version patch missing" }
          if (-not (Select-String -Path certificate_maker.py -Pattern 'Presentations.Open\(' -Quiet)) { throw "PowerPoint COM open missing" }
          if (-not (Select-String -Path certificate_maker.py -Pattern 'MSO_TRUE\)' -Quiet)) { throw "WithWindow=True path missing" }
          if (-not (Select-String -Path certificate_maker.py -Pattern 'PP_WINDOW_MINIMIZED' -Quiet)) { throw "Minimized background mode missing" }
          if (-not (Select-String -Path certificate_maker.py -Pattern 'ExportAsFixedFormat' -Quiet)) { throw "PDF ExportAsFixedFormat missing" }
          if (-not (Select-String -Path certificate_maker.py -Pattern '\.Export\(str\(png_path\.resolve\(\)\), "PNG"' -Quiet)) { throw "PNG Slide.Export missing" }
          if (-not (Select-String -Path certificate_maker.py -Pattern 'SaveCopyAs' -Quiet)) { throw "PPTX SaveCopyAs missing" }
          if (Select-String -Path certificate_maker.py -Pattern 'presentation\.SaveAs\(' -Quiet) { throw "Legacy Presentation.SaveAs still present" }
          if (-not (Test-Path "samples\template.pptx")) { throw "ASCII template resource missing" }
          if (-not (Test-Path "samples\data.xlsx")) { throw "Excel sample missing" }

      - name: Install build dependencies
        shell: powershell
        run: |
          Set-Location $env:CERT_SRC
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build EXE
        shell: powershell
        run: |
          Set-Location $env:CERT_SRC
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name CertificateMaker `
            --hidden-import pythoncom `
            --hidden-import pywintypes `
            --hidden-import win32timezone `
            --hidden-import win32com.client `
            --hidden-import win32com.client.dynamic `
            --hidden-import win32com.client.gencache `
            --collect-submodules win32com `
            --add-data "samples;samples" `
            certificate_maker.py
          if (-not (Test-Path "dist\CertificateMaker.exe")) { throw "EXE was not created" }

      - name: Assemble artifact
        shell: powershell
        run: |
          Set-Location $env:CERT_SRC
          $artifact = Join-Path $env:RUNNER_TEMP "CertificateMaker_v1.2.3_Windows_x64"
          New-Item -ItemType Directory -Force -Path $artifact | Out-Null
          Copy-Item "dist\CertificateMaker.exe" "$artifact\CertificateMaker.exe"
          Copy-Item -Recurse "samples" "$artifact\samples"
          Get-FileHash "$artifact\CertificateMaker.exe" -Algorithm SHA256 | Format-List
          "ARTIFACT_DIR=$artifact" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CertificateMaker_v1.2.3_Windows_x64
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 7
