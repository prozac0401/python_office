name: Build CertificateMaker Windows EXE

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: _chatgpt_build/certificate_maker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install python-pptx

      - name: Generate samples
        run: python generate_samples.py

      - name: Patch hidden PowerPoint window handling
        shell: powershell
        run: |
          $p = "certificate_maker.py"
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          $s = [System.IO.File]::ReadAllText($p, $utf8)
          $old = "            ppt_app.Visible = True if settings.keep_powerpoint_visible else False"
          $new = "            if settings.keep_powerpoint_visible:`n                ppt_app.Visible = True"
          if (-not $s.Contains($old)) { throw "Expected PowerPoint visibility line was not found." }
          [System.IO.File]::WriteAllText($p, $s.Replace($old, $new), $utf8)

      - name: Build EXE
        shell: cmd
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name CertificateMaker
          --hidden-import win32timezone
          --add-data "samples;samples"
          certificate_maker.py

      - name: Assemble package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifact\CertificateMaker | Out-Null
          Copy-Item dist\CertificateMaker.exe artifact\CertificateMaker\CertificateMaker.exe
          Copy-Item certificate_maker.py artifact\CertificateMaker\certificate_maker.py
          Copy-Item requirements.txt artifact\CertificateMaker\requirements.txt
          Copy-Item README.md artifact\CertificateMaker\README.md
          Copy-Item -Recurse samples artifact\CertificateMaker\samples

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CertificateMaker_Windows_x64_fixed
          path: _chatgpt_build/certificate_maker/artifact/CertificateMaker
          if-no-files-found: error
