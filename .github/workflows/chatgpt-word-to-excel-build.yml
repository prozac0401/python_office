name: Build WordToExcel Windows EXE

on:
  push:
    branches:
      - main
      - chatgpt-word-to-excel-build-20260828
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pywin32 pyinstaller

      - name: Build single-file GUI executable
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name WordToExcel `
            --hidden-import=pythoncom `
            --hidden-import=pywintypes `
            --hidden-import=win32timezone `
            --collect-submodules=win32com `
            _chatgpt_build/word_to_excel.py
          if (-not (Test-Path 'dist/WordToExcel.exe')) { throw 'WordToExcel.exe was not created.' }
          Get-Item 'dist/WordToExcel.exe' | Format-List Name,Length,LastWriteTime

      - name: Upload executable package
        uses: actions/upload-artifact@v4
        with:
          name: WordToExcel_COM_Windows
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/WordToExcel.exe
            _chatgpt_build/README.txt
