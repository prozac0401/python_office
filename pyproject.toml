[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "officekit"
version = "0.1.0"
description = "Excel / PPT / Word 자동화 유틸리티 (Win32 COM 미사용)."
readme = "README.md"
license = { text = "MIT" }
authors = [ { name = "공튼이", email = "wonseokie@hotmail.com" } ]
requires-python = ">=3.9"
keywords = ["excel", "ppt", "word", "automation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
]

dependencies = [
  "pandas>=2.0",
  "openpyxl>=3.1",
  "python-pptx>=0.6.23",
  "python-docx>=1.1",
  "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/prozac0401/python_office"
Source = "https://github.com/prozac0401/python_office"
